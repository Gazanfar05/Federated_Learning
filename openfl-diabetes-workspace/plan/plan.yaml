aggregator:
  settings:
    best_state_path: save/best.pbuf
    db_store_rounds: 2
    init_state_path: save/init.pbuf
    last_state_path: save/last.pbuf
    persist_checkpoint: true
    persistent_db_path: local_state/tensor.db
    rounds_to_train: 3
    write_logs: false
  template: src.event_components.EventAggregator
assigner:
  settings:
    task_groups:
    - name: learning
      percentage: 1.0
      tasks:
      - aggregated_model_validation
      - train
      - locally_tuned_model_validation
    - name: evaluation
      percentage: 0
      tasks:
      - aggregated_model_validation
  template: openfl.component.RandomGroupedAssigner
collaborator:
  settings:
    db_store_rounds: 1
    opt_treatment: RESET
    use_delta_updates: false
  template: src.event_components.EventCollaborator
compression_pipeline:
  settings: {}
  template: openfl.pipelines.NoCompressionPipeline
data_loader:
  settings:
    batch_size: 32
    validation_fraction: 0.2
    random_seed: 42
  template: src.dataloader.DiabetesDataLoader
network:
  settings:
    agg_addr: Gazanfars-MacBook-Pro.local
    agg_port: 58931
    cert_folder: cert
    client_reconnect_interval: 5
    enable_atomic_connections: false
    hash_salt: auto
    require_client_auth: true
    transport_protocol: grpc
    use_tls: true
  template: openfl.federation.Network
task_runner:
  settings:
    device: cpu
    learning_rate: 0.001
  template: src.taskrunner.DiabetesTaskRunner
tasks:
  aggregated_model_validation:
    function: validate_task
    kwargs:
      apply: global
      metrics:
      - accuracy
  locally_tuned_model_validation:
    function: validate_task
    kwargs:
      apply: local
      metrics:
      - accuracy
  settings: {}
  train:
    function: train_task
    kwargs:
      epochs: 3
      metrics:
      - loss
